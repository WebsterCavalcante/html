<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /*Declaraões Gerais*/
        * {
            margin: 0px;
            padding: 0px;
            font-family: Arial, Helvetica, sans-serif;
        }
    
        html,
        body {
            width: 100vw;
            height: 100vh;
            background: #233eff;
            background-size: contain;
        }
    
        h1 {
            color: white;
            text-shadow: 3px 3px 0px #1526a7;
            padding: 10px;
        }
    
        /*Declaraões Retrato*/
        @media screen and (orientation: portrait) {
            body {
                background: url("../img/cev-portrait.jpg") no-repeat center bottom;
            }
        }
    
        /*Declaraões Paisagem*/
        @media screen and (orientation: landscape) {
            body {
                background: url("../img/cev-landscape.jpg") no-repeat left bottom;
            }
        }
    </style>
    <title>Media Query</title>
</head>
<body>
    <h1>mude a orientação do seu dispositivo</h1>
</body>
</html>
