<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexBox 001</title>
    <style>
        div.container{
            background-color: rgb(175, 255, 255);
            display: flex;
            flex-flow: row nowrap;
        }
        div.item1{
            background-color: yellow;
            border: 2px solid blue;
            text-align: center;
            flex-basis: 150px;
            flex-shrink: 0;
            flex-grow: 1;
        }
        div.item2{
            background-color: yellow;
            border: 2px solid blue;
            text-align: center;
            flex-basis: 150px;
            flex-grow: 2;
            flex-shrink: 0;
        }
        div.item3{
            background-color: yellow;
            border: 2px solid blue;
            text-align: center;
            flex-grow: 1;
            flex-shrink: 2;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item1">A</div>
        <div class="item2">B</div>
        <div class="item3">C</div>
    </div>
</body>
</html>
