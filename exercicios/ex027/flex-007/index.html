<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexBox 001</title>
    <style>
        div.container{
            background-color: rgb(175, 255, 255);
            display: flex;
            flex-flow: row wrap;
        }
        div.item{
            background-color: rgb(250, 157, 242);
            border: 1px solid black;
            text-align: center;
            padding: 20px;
        }
        div#i1{
            order: 0;
            width: 100px;
        }
        div#i2{
            order: -2;
        }
        div#i3{
            order: 4;
        }
        div#i4{
            order: 8;
        }
        div#i5{
            order: 2;
        }
        div#i6{
            order: 0;
        }
        div#i7{
            order: -4;
            width: 150px;
            font-weight: bolder;
            background-color: blueviolet;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="item"id="i1">A</div>
        <div class="item"id="i2">B</div>
        <div class="item"id="i3">C</div>
        <div class="item"id="i4">D</div>
        <div class="item"id="i5">E</div>
        <div class="item"id="i6">F</div>
        <div class="item"id="i7">G</div>
    </div>
</body>
</html>
