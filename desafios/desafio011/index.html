<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        #conteiner{
            position: relative;
            background: black url('imagens/espaco.jpg') no-repeat center center fixed;
            height: 98vh;
            background-size: 100%;
        }
        #conetudo{
            position: absolute;
            background: url('imagens/astronauta.png') no-repeat center center;
            height: 100%;
            width: 100%;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
        }
    </style>
</head>
<body>
    <div id="conteiner">
        <div id="conetudo">

        </div>
    </div>
</body>
</html>
